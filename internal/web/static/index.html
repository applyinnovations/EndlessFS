<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>EndlessFS</title>
    <link rel="stylesheet" href="/assets/app.css">
    <script src="/assets/app.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">Private storage, direct by design</p>
      <h1>EndlessFS</h1>
      <p class="lede">
        The passkey identity and provider-capability foundations are running.
        File workflows and the complete drive interface remain under construction.
      </p>
      <dl aria-label="Process status">
        <div>
          <dt>Control plane</dt>
          <dd><span class="status" aria-hidden="true"></span>Ready</dd>
        </div>
        <div>
          <dt>Build</dt>
          <dd id="build-version">Loading</dd>
        </div>
      </dl>
      <noscript>JavaScript is required for the finished EndlessFS drive interface.</noscript>
    </main>
  </body>
</html>
