apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: endlessfs-ci-
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: >-
      (event == "pull_request" && target_branch == "main") ||
      (event == "push" &&
        target_branch.startsWith("refs/heads/gh-readonly-queue/main/"))
    pipelinesascode.tekton.dev/max-keep-runs: "10"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/target-namespace: "tekton-buildkit"
    ci/trigger: required
  labels:
    app.kubernetes.io/part-of: endlessfs-ci
    tekton.dev/pipeline: endlessfs-ci
    ci/repo: "{{ repo_name }}"
spec:
  taskRunTemplate:
    serviceAccountName: tekton-build-sa
    podTemplate:
      automountServiceAccountToken: false
      nodeSelector:
        storage.xlab.now/fast-local: "true"
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
  taskRunSpecs:
    - pipelineTaskName: clone
      stepSpecs:
        - name: clone
          computeResources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
    # Every check, including the plain and race Go test runs.
    - pipelineTaskName: checks
      podTemplate:
        hostUsers: false
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: "6"
              memory: 12Gi
            limits:
              cpu: "12"
              memory: 24Gi
    # Browser tests act against wall-clock deadlines; Go is capped at 8
    # threads so it cannot take the CPU the headless Chromium instances need.
    - pipelineTaskName: e2e
      podTemplate:
        hostUsers: false
        env:
          - name: GOMAXPROCS
            value: "8"
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: "8"
              memory: 8Gi
            limits:
              cpu: "16"
              memory: 16Gi
    - pipelineTaskName: security-freshness
      podTemplate:
        hostUsers: false
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
  timeouts:
    pipeline: 30m0s
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
  # checks and security-freshness run in parallel after the clone, then e2e; each
  # nix-v1 pod has its own Nix store filled from the shared cache. No
  # nix-cache-export volume and no publish-cache: pull-request and merge-queue
  # runs build code that is not on main yet.
  pipelineSpec:
    params:
      - name: repo_url
        type: string
      - name: revision
        type: string
    workspaces:
      - name: source
      - name: basic-auth
    tasks:
      - name: clone
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: git-clone-v1
            - name: namespace
              value: tekton-pipelines
        timeout: 10m
        workspaces:
          - name: output
            workspace: source
          - name: basic-auth
            workspace: basic-auth
        params:
          - name: url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)
          - name: depth
            value: "1"

      - name: checks
        runAfter: [clone]
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-v1
            - name: namespace
              value: tekton-buildkit
        timeout: 25m
        workspaces:
          - name: source
            workspace: source
        params:
          - name: SCRIPT
            value: nix flake check --print-build-logs --max-jobs 6 --cores 2

      # The browser tests act against wall-clock deadlines; running them
      # beside the checks' Go test runs starved Chromium of CPU, so they
      # follow the checks, as the old coverage task did.
      - name: e2e
        runAfter: [checks]
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-v1
            - name: namespace
              value: tekton-buildkit
        timeout: 25m
        workspaces:
          - name: source
            workspace: source
        params:
          - name: SCRIPT
            value: nix run .#test-e2e

      - name: security-freshness
        runAfter: [clone]
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-v1
            - name: namespace
              value: tekton-buildkit
        timeout: 15m
        workspaces:
          - name: source
            workspace: source
        params:
          - name: SCRIPT
            value: nix run .#security-freshness
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: fast-local
          resources:
            requests:
              storage: 10Gi
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
