name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix-checks:
    name: Nix checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # v3.21.9
        with:
          determinate: false

      - name: Restore and save Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Run the authoritative Nix gate
        run: nix flake check --print-build-logs --max-jobs 2

      # Chromium's virtual WebAuthn authenticator cannot complete inside a Nix
      # build sandbox. This Nix app runs on the host while consuming the same
      # fixed-output vendored module closure as the sandboxed checks.
      - name: Run the browser and coverage gate
        run: nix run .#test-coverage
