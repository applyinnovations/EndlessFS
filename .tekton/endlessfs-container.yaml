apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: endlessfs-container-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/target-namespace: "tekton-buildkit"
    ci/trigger: main
  labels:
    app.kubernetes.io/part-of: endlessfs-ci
    tekton.dev/pipeline: endlessfs-container
    ci/repo: "{{ repo_name }}"
spec:
  taskRunTemplate:
    serviceAccountName: tekton-build-sa
    podTemplate:
      automountServiceAccountToken: false
      nodeSelector:
        storage.xlab.now/fast-local: "true"
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
  taskRunSpecs:
    - pipelineTaskName: clone
      stepSpecs:
        - name: clone
          computeResources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
    - pipelineTaskName: build
      podTemplate:
        hostUsers: false
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: "6"
              memory: 12Gi
            limits:
              cpu: "12"
              memory: 24Gi
    - pipelineTaskName: publish-cache
      serviceAccountName: nix-cache-publisher
  timeouts:
    pipeline: 45m0s
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
  pipelineSpec:
    params:
      - name: repo_url
        type: string
      - name: revision
        type: string
    workspaces:
      - name: source
      - name: artifacts
      - name: nix-cache-export
      - name: basic-auth
      - name: ghcr-docker-config
    tasks:
      - name: clone
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: git-clone-v1
            - name: namespace
              value: tekton-pipelines
        timeout: 10m
        workspaces:
          - name: output
            workspace: source
          - name: basic-auth
            workspace: basic-auth
        params:
          - name: url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)
          - name: depth
            value: "1"

      # Builds the image without credentials; publish pushes the archive.
      - name: build
        runAfter: [clone]
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-v1
            - name: namespace
              value: tekton-buildkit
        timeout: 25m
        workspaces:
          - name: source
            workspace: source
          - name: artifacts
            workspace: artifacts
          - name: nix-cache-export
            workspace: nix-cache-export
        params:
          - name: SCRIPT
            value: |
              nix run .#security-freshness
          - name: IMAGE
            value: .#container

      - name: publish
        runAfter: [build]
        retries: 2
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: oci-publish-v1
            - name: namespace
              value: tekton-pipelines
        timeout: 10m
        workspaces:
          - name: artifacts
            workspace: artifacts
          - name: docker-config
            workspace: ghcr-docker-config
        params:
          - name: IMAGE
            value: ghcr.io/applyinnovations/endlessfs
          - name: COMMIT_SHA
            value: $(tasks.clone.results.COMMIT_SHA)
          - name: ARCHIVE_SHA256
            value: $(tasks.build.results.ARCHIVE_SHA256)
          - name: EXTRA_TAGS
            value: |
              sha-$(tasks.clone.results.COMMIT_SHA)
              edge
    # Push runs publish what build exported to the shared Nix cache.
    finally:
      - name: publish-cache
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-cache-publish-v1
            - name: namespace
              value: tekton-pipelines
        workspaces:
          - name: nix-cache-export
            workspace: nix-cache-export
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: fast-local
          resources:
            requests:
              storage: 10Gi
    # The image archive, handed from build to publish without source or store.
    - name: artifacts
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: fast-local
          resources:
            requests:
              storage: 5Gi
    # Store paths the Nix cache lacks, written by build for publish-cache.
    - name: nix-cache-export
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: fast-local
          resources:
            requests:
              storage: 10Gi
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
    # GHCR dockerconfigjson (write:packages only), mounted only by publish.
    - name: ghcr-docker-config
      secret:
        secretName: github-packages-docker-config
