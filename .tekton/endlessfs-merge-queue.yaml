apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: endlessfs-ci-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[refs/heads/gh-readonly-queue/main/*]"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/target-namespace: "tekton-buildkit"
    ci/trigger: merge-queue
  labels:
    app.kubernetes.io/part-of: endlessfs-ci
    tekton.dev/pipeline: endlessfs-ci
    ci/repo: "{{ repo_name }}"
spec:
  taskRunTemplate:
    serviceAccountName: tekton-build-sa
    podTemplate:
      nodeSelector:
        storage.xlab.now/fast-local: "true"
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
  taskRunSpecs:
    - pipelineTaskName: clone
      stepSpecs:
        - name: clone
          computeResources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
    - pipelineTaskName: fast-checks
      podTemplate:
        hostUsers: false
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
    - pipelineTaskName: prepare-cache
      podTemplate:
        hostUsers: false
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
    - pipelineTaskName: nix-checks
      podTemplate:
        hostUsers: false
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: "6"
              memory: 12Gi
            limits:
              cpu: "12"
              memory: 24Gi
    - pipelineTaskName: coverage
      podTemplate:
        hostUsers: false
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
  timeouts:
    pipeline: 60m0s
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: git_auth_secret
      value: "{{ git_auth_secret }}"
  pipelineSpec:
    params:
      - name: repo_url
        type: string
      - name: revision
        type: string
      - name: git_auth_secret
        type: string
    workspaces:
      - name: source
      - name: git-cache
      - name: nix-store
      - name: basic-auth
    tasks:
      - name: clone
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: git-clone-cached
            - name: namespace
              value: tekton-pipelines
        timeout: 10m
        workspaces:
          - name: output
            workspace: source
          - name: git-cache
            workspace: git-cache
          - name: basic-auth
            workspace: basic-auth
        params:
          - name: url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)
          - name: depth
            value: "1"
          - name: cache-key
            value: applyinnovations-endlessfs

      - name: prepare-cache
        runAfter: [clone]
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-run-v2
            - name: namespace
              value: tekton-buildkit
        timeout: 15m
        workspaces:
          - name: source
            workspace: source
          - name: nix-store
            workspace: nix-store
        params:
          - name: SCRIPT
            value: nix --version

      - name: fast-checks
        runAfter: [prepare-cache]
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-run-v2
            - name: namespace
              value: tekton-buildkit
        timeout: 15m
        workspaces:
          - name: source
            workspace: source
          - name: nix-store
            workspace: nix-store
        params:
          - name: SCRIPT
            value: nix run .#pr-check

      - name: nix-checks
        runAfter: [prepare-cache]
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-run-v2
            - name: namespace
              value: tekton-buildkit
        timeout: 45m
        workspaces:
          - name: source
            workspace: source
          - name: nix-store
            workspace: nix-store
        params:
          - name: SCRIPT
            value: nix flake check --print-build-logs --max-jobs 6 --cores 2

      - name: coverage
        runAfter: [prepare-cache]
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-run-v2
            - name: namespace
              value: tekton-buildkit
        timeout: 45m
        workspaces:
          - name: source
            workspace: source
          - name: nix-store
            workspace: nix-store
        params:
          - name: SCRIPT
            value: nix run .#test-coverage
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: fast-local
          resources:
            requests:
              storage: 20Gi
    - name: git-cache
      persistentVolumeClaim:
        claimName: endlessfs-git-repo-cache
    - name: nix-store
      persistentVolumeClaim:
        claimName: endlessfs-nix-store
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
