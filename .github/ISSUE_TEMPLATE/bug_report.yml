name: Bug report
description: Report reproducible behavior that is incorrect or unreliable.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve EndlessFS. Do not include credentials, tokens, personal data, private file content, or provider identifiers.

        Suspected security vulnerabilities must follow the [security policy](https://github.com/applyinnovations/EndlessFS/security/policy) instead of this public form.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the incorrect behavior and its impact.
      placeholder: A concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Give the smallest deterministic sequence that reproduces the problem. Use the local fixture where possible.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen?
      description: Describe the expected observable behavior.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Files and folders
        - Transfers
        - Trash
        - Previews and shares
        - Account and administration
        - Authentication and setup
        - Themes and accessibility
        - Storage provider or portability
        - Build, test, or release tooling
        - Other
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or revision
      description: Provide the release, commit SHA, or pull-request build when known.
      placeholder: v1.0.0 or abc1234
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include browser and operating system for UI issues, or provider profile for backend issues. Do not include secrets.
      placeholder: Firefox 128 on macOS 15
  - type: textarea
    id: scale
    attributes:
      label: Relevant scale
      description: If scale matters, describe the approximate number of files, directories, transfers, users, or replicas involved.
      placeholder: Approximately 2,000 queued uploads across 40 folders.
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add sanitized logs, screenshots, or recordings. Drag files into this field rather than pasting private links.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets, personal data, private file content, tokens, and provider identifiers.
          required: true
        - label: This is not a security vulnerability.
          required: true
