apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: endlessfs-release-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[refs/tags/v*.*.*]"
    pipelinesascode.tekton.dev/max-keep-runs: "20"
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/target-namespace: "tekton-buildkit"
    ci/trigger: release
  labels:
    app.kubernetes.io/part-of: endlessfs-ci
    tekton.dev/pipeline: endlessfs-release
    ci/repo: "{{ repo_name }}"
spec:
  taskRunTemplate:
    serviceAccountName: tekton-build-sa
    podTemplate:
      nodeSelector:
        storage.xlab.now/fast-local: "true"
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
  taskRunSpecs:
    - pipelineTaskName: clone
      stepSpecs:
        - name: clone
          computeResources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
    - pipelineTaskName: verify
      podTemplate:
        hostUsers: false
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: "6"
              memory: 12Gi
            limits:
              cpu: "12"
              memory: 24Gi
    - pipelineTaskName: release
      podTemplate:
        hostUsers: false
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: "6"
              memory: 12Gi
            limits:
              cpu: "12"
              memory: 24Gi
  # PaC installation tokens expire after one hour. Keep the complete sequential
  # release path below that boundary so the clone token remains valid for the
  # final release and asset API calls.
    - pipelineTaskName: publish-cache
      serviceAccountName: nix-cache-publisher
  timeouts:
    pipeline: 55m0s
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: release_tag
      value: "{{ git_tag }}"
    - name: git_auth_secret
      value: "{{ git_auth_secret }}"
  pipelineSpec:
    params:
      - name: repo_url
        type: string
      - name: revision
        type: string
      - name: release_tag
        type: string
      - name: git_auth_secret
        type: string
    workspaces:
      - name: source
      - name: release-source
      - name: git-cache
      - name: nix-store
      - name: basic-auth
      - name: github-packages-auth
    tasks:
      - name: clone
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: git-clone-cached
            - name: namespace
              value: tekton-pipelines
        timeout: 5m
        workspaces:
          - name: output
            workspace: source
          - name: git-cache
            workspace: git-cache
          - name: basic-auth
            workspace: basic-auth
        params:
          - name: url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)
          - name: depth
            value: "0"
          - name: cache-key
            value: applyinnovations-endlessfs

      - name: verify
        runAfter: [clone]
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-run-v2
            - name: namespace
              value: tekton-buildkit
        timeout: 35m
        workspaces:
          - name: source
            workspace: source
          - name: nix-store
            workspace: nix-store
        params:
          - name: SCRIPT
            value: nix run .#release-verify -- "$(params.release_tag)" --max-jobs 6 --cores 2

      # The release task holds GH_TOKEN and the GitHub Packages credential, so
      # it runs publish-release from its own checkout of the commit verify
      # checked, never from the source workspace verify could have changed.
      - name: release-clone
        runAfter: [verify]
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: git-clone-v1
            - name: namespace
              value: tekton-pipelines
        timeout: 5m
        workspaces:
          - name: output
            workspace: release-source
          - name: basic-auth
            workspace: basic-auth
        params:
          - name: url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)
          - name: expectedCommitSha
            value: $(tasks.clone.results.COMMIT_SHA)
          - name: depth
            value: "1"
          - name: objectFilter
            value: none

      - name: release
        runAfter: [release-clone]
        retries: 2
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-run-github-v2
            - name: namespace
              value: tekton-buildkit
        timeout: 15m
        workspaces:
          - name: source
            workspace: release-source
          - name: nix-store
            workspace: nix-store
          - name: github-packages-auth
            workspace: github-packages-auth
        params:
          - name: GITHUB_TOKEN_SECRET_NAME
            value: $(params.git_auth_secret)
          - name: SCRIPT
            value: nix run .#publish-release -- "$(params.release_tag)"
    # Push and scheduled runs publish this run's store to the shared Nix cache.
    finally:
      - name: publish-cache
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-cache-publish
            - name: namespace
              value: tekton-pipelines
        workspaces:
          - name: nix-store
            workspace: nix-store
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: fast-local
          resources:
            requests:
              storage: 10Gi
    - name: release-source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: fast-local
          resources:
            requests:
              storage: 10Gi
    - name: git-cache
      persistentVolumeClaim:
        claimName: git-repo-cache
    # A private Nix store for this run, shared by its tasks and deleted with the
    # PipelineRun; tools come from the shared Nix cache.
    - name: nix-store
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: fast-local
          resources:
            requests:
              storage: 60Gi
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: github-packages-auth
      secret:
        secretName: github-packages-credentials
