name: Repository Policy

on:
  workflow_dispatch:

concurrency:
  group: repository-policy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply branch and tag rulesets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: repository-policy
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # v3.21.9
        with:
          determinate: false

      - name: Validate checked-in policy
        run: nix run .#repository-policy -- check

      - name: Apply checked-in policy
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_RULESET_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: nix run .#repository-policy -- apply
