name: Container

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish GHCR image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # v3.21.9
        with:
          determinate: false

      - name: Restore and save Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Verify the image source
        run: nix flake check --print-build-logs --max-jobs 1

      - name: Build and publish immutable and edge tags
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: >-
          nix run .#publish-container --
          "ghcr.io/applyinnovations/endlessfs:sha-${GITHUB_SHA}"
          "ghcr.io/applyinnovations/endlessfs:edge"
